<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - Budgetly Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="admin-dashboard.html">
                Budgetly Admin
            </a>

            <button class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>

        </div>
    </nav>


    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-dark min-vh-100 p-0">

                <div class="list-group list-group-flush">

                    <a href="admin-dashboard.html"
                       class="list-group-item list-group-item-action bg-dark text-white">
                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard
                    </a>

                    <a href="users.html"
                       class="list-group-item list-group-item-action bg-dark text-white">
                        <i class="bi bi-people me-2"></i>
                        Users
                    </a>

                    <a href="transactions.html"
                       class="list-group-item list-group-item-action bg-dark text-white">
                        <i class="bi bi-arrow-left-right me-2"></i>
                        Transactions
                    </a>

                    <a href="categories.html"
                       class="list-group-item list-group-item-action bg-dark text-white">
                        <i class="bi bi-tags me-2"></i>
                        Categories
                    </a>

                    <a href="reports.html"
                       class="list-group-item list-group-item-action bg-dark text-white">
                        <i class="bi bi-bar-chart-line me-2"></i>
                        Reports
                    </a>

                    <a href="settings.html"
                       class="list-group-item list-group-item-action active">
                        <i class="bi bi-gear me-2"></i>
                        Settings
                    </a>

                </div>

            </div>


            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">

                <!-- Page Heading -->
                <div class="mb-4">

                    <h2 class="fw-bold">
                        Settings
                    </h2>

                    <p class="text-muted">
                        Manage Budgetly admin settings and preferences
                    </p>

                </div>


                <!-- General Settings -->
                <div class="card shadow-sm border-0 mb-4">

                    <div class="card-header bg-white">

                        <h5 class="fw-bold mb-0">
                            <i class="bi bi-sliders me-2"></i>
                            General Settings
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Application Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       value="Budgetly">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Admin Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       value="admin@budgetly.com">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Currency
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Indian Rupee (₹)
                                    </option>

                                    <option>
                                        US Dollar ($)
                                    </option>

                                    <option>
                                        Euro (€)
                                    </option>

                                    <option>
                                        Pound (£)
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Time Zone
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        India Standard Time (IST)
                                    </option>

                                    <option>
                                        UTC
                                    </option>

                                    <option>
                                        Eastern Time
                                    </option>

                                </select>

                            </div>

                        </div>

                        <button class="btn btn-primary mt-4">
                            <i class="bi bi-check-circle me-1"></i>
                            Save Changes
                        </button>

                    </div>

                </div>


                <!-- Notification Settings -->
                <div class="card shadow-sm border-0 mb-4">

                    <div class="card-header bg-white">

                        <h5 class="fw-bold mb-0">
                            <i class="bi bi-bell me-2"></i>
                            Notification Settings
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="form-check form-switch mb-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="newUser"
                                   checked>

                            <label class="form-check-label" for="newUser">
                                Notify when a new user registers
                            </label>

                        </div>


                        <div class="form-check form-switch mb-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="transaction"
                                   checked>

                            <label class="form-check-label" for="transaction">
                                Notify about new transactions
                            </label>

                        </div>


                        <div class="form-check form-switch">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="reports">

                            <label class="form-check-label" for="reports">
                                Receive weekly financial reports
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Security Settings -->
                <div class="card shadow-sm border-0 mb-4">

                    <div class="card-header bg-white">

                        <h5 class="fw-bold mb-0">
                            <i class="bi bi-shield-lock me-2"></i>
                            Security Settings
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Current Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter current password">

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                New Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter new password">

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Confirm New Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Confirm new password">

                        </div>


                        <button class="btn btn-warning">

                            <i class="bi bi-key me-1"></i>
                            Update Password

                        </button>

                    </div>

                </div>


                <!-- System Information -->
                <div class="card shadow-sm border-0">

                    <div class="card-header bg-white">

                        <h5 class="fw-bold mb-0">
                            <i class="bi bi-info-circle me-2"></i>
                            System Information
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <strong>Application:</strong>

                                <span class="text-muted">
                                    Budgetly
                                </span>

                            </div>


                            <div class="col-md-6 mb-3">

                                <strong>Version:</strong>

                                <span class="text-muted">
                                    1.0.0
                                </span>

                            </div>


                            <div class="col-md-6 mb-3">

                                <strong>Environment:</strong>

                                <span class="badge bg-success">
                                    Production
                                </span>

                            </div>


                            <div class="col-md-6 mb-3">

                                <strong>Database Status:</strong>

                                <span class="badge bg-success">
                                    Connected
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
